# Construcción de la UI de Guatemala con Grunt (dev-ui oficial + piezas GTM).
#   ../openlmis-gtm-dev-ui              -> solo tasks/messages.js (traducciones GTM reemplazan a las de módulos)
#   ../openlmis-gtm-stockmanagement-ui  -> src/ con la corrección de vencimientos y traducciones
# Módulos y versiones: los de gtm.1-gtm.4 (19/08/2026), fijados por digest a la construcción
# validada el 27/09/2026 (mismas 2737 traducciones y funciones que gtm.5). Las etiquetas
# -SNAPSHOT pueden cambiar sin aviso; el digest garantiza que siempre se use la misma imagen.
services:
  reference-ui:
    image: openlmis/dev-ui:9.0.9-SNAPSHOT@sha256:0745eb7ba852e20207601cbceefafd693031e45227720ed77d58e58b135b4403
    working_dir: /app
    environment:
      TRANSIFEX_PUSH: "false"
      TRANSIFEX_PULL: "false"
    volumes:
      - '.:/app'
      - '../openlmis-gtm-dev-ui/tasks/messages.js:/dev-ui/tasks/messages.js:ro'
      - '../openlmis-gtm-stockmanagement-ui/src:/openlmis-stockmanagement-ui/src:ro'
    volumes_from:
      - auth-ui
      - fulfillment-ui
      - referencedata-ui
      - requisition-ui
      - report-ui
      - stockmanagement-ui
      - cce-ui
      - ui-components
      - ui-layout
      - offline-ui
      - one-network-integration-ui
  auth-ui:

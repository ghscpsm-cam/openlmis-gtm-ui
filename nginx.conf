server {
    location / {
        root /usr/share/nginx/html;
        index index.html index.html;

        # Always revalidate UI assets so clients do not retain an older catalog.
        add_header Cache-Control "no-cache";

        gzip on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_types text/css text/javascript text/plain application/javascript application/x-javascript image/x-icon;
    }
}
